name: Fairness (all generated seeds)

# Every push rides generated seeds 1–5 (tests.yml). This rides seeds 1–2000 with every cargo and every autopilot
# rider, and the first 2,000 daily routes (F-34), in eight shards of 250 each. One failing seed means a generator rule gets fixed, not a seed skipped (F-33).
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  seeds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Expressions can't do arithmetic, so the shard's starting seed and day are worked out in the shell.
      - run: |
          export FAIRNESS_FROM=$(( SHARD * 250 + 1 )) FAIRNESS_SEEDS=250 FAIRNESS_DAY_FROM=$(( SHARD * 250 )) FAIRNESS_DAYS=250
          echo "seeds $FAIRNESS_FROM-$(( FAIRNESS_FROM + 249 )), days $FAIRNESS_DAY_FROM-$(( FAIRNESS_DAY_FROM + 249 ))"
          node --test tests/fairness.test.mjs
        env:
          SHARD: ${{ matrix.shard }}
